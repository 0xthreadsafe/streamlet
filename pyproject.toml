[project]
name = "streamlet"
version = "0.1.0"
description = "A fluent, lazy stream-processing library for Python, modeled after Java's Streams API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "0xthreadsafe", email = "a.ghasabeh@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
streamlet = "streamlet:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "hypothesis>=6.0",
    "pre-commit>=4.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # style
    "F",         # real errors (unused imports, undefined names)
    "I",         # import sorting
    "UP",        # modernize old syntax
    "B",         # common bug patterns
    "SIM",       # simplifications
    "C4",        # better comprehensions
    "RUF",       # ruff's own rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
