[project]
name = "pystreamlet"
version = "0.1.0"
description = "A fluent, lazy stream-processing library for Python, modeled after Java's Streams API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "0xthreadsafe", email = "a.ghasabeh@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []
keywords = ["stream", "streams", "lazy", "itertools", "functional", "pipeline", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/0xthreadsafe/streamlet"
Repository = "https://github.com/0xthreadsafe/streamlet"
Changelog = "https://github.com/0xthreadsafe/streamlet/blob/main/CHANGELOG.md"
Issues = "https://github.com/0xthreadsafe/streamlet/issues"

[project.scripts]
streamlet = "streamlet:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

# The distribution is pystreamlet but the module stays streamlet, so the
# backend has to be told rather than inferring the path from the name.
[tool.uv.build-backend]
module-name = "streamlet"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "hypothesis>=6.0",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # style
    "F",         # real errors (unused imports, undefined names)
    "I",         # import sorting
    "UP",        # modernize old syntax
    "B",         # common bug patterns
    "SIM",       # simplifications
    "C4",        # better comprehensions
    "RUF",       # ruff's own rules
    "D",         # docstrings on the public API
]
ignore = [
    "D105",      # magic methods: documented where they are not obvious
    "D107",      # __init__: the class docstring covers construction
    "D400",      # summaries may end in "::" to introduce an example
    "D415",      # same
    "D401",      # "True if ..." reads better than a forced imperative
    "D203",      # incompatible with D211 (no blank line before class docstring)
    "D213",      # incompatible with D212 (summary on the first line)
]

[tool.ruff.lint.per-file-ignores]
# Docstrings are a public-API gate; test and example names carry their own meaning.
"tests/**" = ["B011", "D1"]
"examples/**" = ["D1"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "examples"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
