name: Publish

# Builds on every tag, then publishes through PyPI's trusted publishing (OIDC),
# so no API token is stored in this repo. Test PyPI runs on the tag; PyPI runs
# only once the GitHub release for that tag is published, which keeps the real
# upload a deliberate, manual step.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Check the tag matches the project version
        if: github.event_name == 'push'
        run: |
          version=$(uv version --short)
          tag="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag" || {
            echo "tag $tag does not match project version $version" >&2
            exit 1
          }
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-pypi:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: test-pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
